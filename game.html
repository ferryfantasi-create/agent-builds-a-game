<!DOCTYPE html>
<!-- Moon Hop -->
<!-- A tiny browser game, built from one prompt: -->
<!-- "Build a tiny browser game: a moon hops between floating -->
<!-- platforms, collects stars, and the score goes up. -->
<!-- Space to hop." -->
<!-- Open this file in a browser, press Space to hop. -->
<html>
<head>
<meta charset="utf-8">
<title>Moon Hop</title>
<style>
  body { margin: 0; background: #111; display: flex; justify-content: center; }
  canvas { background: #5aa9ff; }
</style>
</head>
<body>
<canvas id="game" width="540" height="960"></canvas>
<script>
// The five floating platforms the moon hops between.
const platforms = [
  { x: 40,  y: 760, w: 180 },
  { x: 300, y: 680, w: 170 },
  { x: 60,  y: 580, w: 165 },
  { x: 310, y: 480, w: 175 },
  { x: 90,  y: 380, w: 180 },
];
// One star floats above each platform.
const stars = platforms.map(p => ({ x: p.x + p.w / 2, y: p.y - 55 }));
const canvas = document.getElementById('game');
const ctx = canvas.getContext('2d');
let current = 0;          // platform the moon stands on
let hop = -1;             // hop progress 0..1, -1 means standing still
let score = 0;
let taken = new Set();    // stars already collected
let time = 0;

function drawSky() {
  const g = ctx.createLinearGradient(0, 0, 0, 960);
  g.addColorStop(0, '#5aa9ff');
  g.addColorStop(1, '#cfe8ff');
  ctx.fillStyle = g;
  ctx.fillRect(0, 0, 540, 960);
  // A big sun in the corner.
  ctx.fillStyle = '#ffe996';
  ctx.beginPath();
  ctx.arc(450, 160, 35, 0, 7);
  ctx.fill();
}

function drawPlatforms() {
  platforms.forEach(p => {
    ctx.fillStyle = '#785028';
    ctx.fillRect(p.x, p.y, p.w, 17);
    ctx.fillStyle = '#6ec85a';
    ctx.fillRect(p.x, p.y, p.w, 8);
  });
}

function drawStars() {
  stars.forEach((s, i) => {
    if (taken.has(i)) return;
    ctx.fillStyle = '#ffd700';
    ctx.beginPath();
    for (let k = 0; k < 10; k++) {
      const a = -Math.PI / 2 + k * Math.PI / 5;
      const r = k % 2 ? 8 : 18;
      ctx[k ? 'lineTo' : 'moveTo'](s.x + r * Math.cos(a), s.y + r * Math.sin(a));
    }
    ctx.fill();
  });
}

function drawMoon() {
  let mx = platforms[current].x + platforms[current].w / 2;
  let my = platforms[current].y - 21;
  if (hop >= 0) {
    const next = (current + 1) % platforms.length;
    const u = hop;
    mx = mx + (platforms[next].x + platforms[next].w / 2 - mx) * u;
    my = my + (platforms[next].y - 21 - my) * u - Math.sin(u * Math.PI) * 110;
  }
  ctx.fillStyle = '#ffec8c';
  ctx.beginPath();
  ctx.arc(mx, my, 21, 0, 7);
  ctx.fill();
  // The moon's two eyes.
  ctx.fillStyle = '#1e1e1e';
  ctx.beginPath();
  ctx.arc(mx - 7, my - 3, 3, 0, 7);
  ctx.arc(mx + 7, my - 3, 3, 0, 7);
  ctx.fill();
}

function drawHud() {
  ctx.fillStyle = '#fff';
  ctx.font = 'bold 28px sans-serif';
  ctx.fillText('SCORE ' + score, 20, 50);
  ctx.font = '20px sans-serif';
  ctx.fillText('Press SPACE to hop', 20, 920);
}

function draw() {
  drawSky();
  drawPlatforms();
  drawStars();
  drawMoon();
  drawHud();
}

function step() {
  time += 0.016;
  if (hop >= 0) {
    hop += 0.02;
    if (hop >= 1) {
      current = (current + 1) % platforms.length;
      if (!taken.has(current)) {
        taken.add(current);
        score += 10;
      }
      hop = -1;
    }
  }
  draw();
  requestAnimationFrame(step);
}

addEventListener('keydown', e => {
  if (e.code === 'Space' && hop < 0) hop = 0;
});
step();
</script>
</body>
</html>
